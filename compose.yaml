version: "3.8"
services:
  server:
    build: .
    restart: unless-stopped
    container_name: "backend"
    environment:
      DATABASE_USER: root
      DATABASE_PASSWORD: Alienusa01
      DATABASE_HOST: "mysql"
      DATABASE_NAME: my-project-db
    ports:
      - "8081:8080"
    networks:
      - my-project-network
    depends_on:
      - mysql
  mysql:
      image: "mysql:8.0"
      container_name: "mysql_db"
      restart: unless-stopped
      ports:
        - "3307:3306"
      networks:
            - my-project-network
      environment:
        MYSQL_DATABASE: my-project-db
        MYSQL_USER: zzino
        MYSQL_PASSWORD: Alienusa01
        MYSQL_ROOT_PASSWORD: Alienusa01

networks:
  my-project-network:

